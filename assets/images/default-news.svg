<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Water & boat scenery simulation -->
  <rect y="280" width="800" height="220" fill="url(#water)"/>
  <!-- Trees / houses background -->
  <ellipse cx="200" cy="280" rx="120" ry="40" fill="#065f46" opacity="0.8"/>
  <ellipse cx="450" cy="270" rx="180" ry="50" fill="#047857" opacity="0.8"/>
  <ellipse cx="700" cy="280" rx="140" ry="40" fill="#065f46" opacity="0.8"/>
  <!-- Boat -->
  <path d="M 280,380 Q 400,430 520,380 L 500,400 Q 400,440 300,400 Z" fill="#78350f" stroke="#451a03" stroke-width="2"/>
  <text x="400" y="340" font-family="'Hind Siliguri', sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">আজাদ নিউজ ২৪ - বিশেষ সংবাদ চিত্র</text>
  <circle cx="400" cy="200" r="45" fill="#f59e0b" opacity="0.8"/>
</svg>
